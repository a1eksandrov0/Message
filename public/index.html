<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }
    .apple-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Градиент iMessage для собственных сообщений */
    .imessage-blue {
      background: linear-gradient(180deg, #007aff 0%, #0056c6 100%);
      background-attachment: fixed;
      color: #ffffff;
    }
    /* Серые бабблы для входящих сообщений */
    .imessage-gray {
      background-color: #26252a;
      color: #ffffff;
    }
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-4 overflow-hidden relative select-none">

  <!-- Приветственный экран -->
  <div id="landing-screen" class="flex flex-col items-center justify-between h-[80vh] max-w-2xl text-center px-4">
    <div class="mt-12">
      <h1 class="text-7xl md:text-8xl font-bold tracking-tight text-white">Message</h1>
    </div>

    <button onclick="showAuthModal()" class="bg-white hover:bg-gray-200 text-black font-medium text-lg px-8 py-3 rounded-full transition duration-200 shadow-lg cursor-pointer">
      Войти
    </button>

    <div class="mb-12">
      <p class="text-2xl md:text-4xl font-semibold leading-relaxed text-gray-200">
        Сервис экспресс-сообщений.
      </p>
    </div>
  </div>

  <!-- Окно авторизации -->
  <div id="auth-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="apple-card rounded-3xl p-8 w-full max-w-md shadow-2xl relative flex flex-col items-center text-center">
      <button onclick="hideAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl p-2">✕</button>

      <h2 class="text-2xl font-semibold mb-6 mt-2">Вход с Аккаунтом Message</h2>

      <div id="auth-error" class="text-red-400 text-sm mb-4 hidden w-full text-center px-2 py-1 bg-red-500/10 rounded-lg border border-red-500/20"></div>

      <div class="space-y-4 w-full">
        <input id="auth-id" type="text" maxlength="6" placeholder="ID (для входа)" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 font-mono">
        <input id="auth-password" type="password" placeholder="Пароль" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500">

        <div class="pt-2 flex gap-3">
          <button onclick="login()" class="flex-1 bg-[#007aff] hover:bg-blue-600 text-white font-medium py-3 rounded-xl transition">Продолжить</button>
          <button onclick="register()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-medium py-3 rounded-xl transition">Создать ID</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Экран Мессенджера -->
  <div id="chat-screen" class="apple-card rounded-3xl w-full max-w-5xl h-[85vh] shadow-2xl flex hidden overflow-hidden">
    <!-- Боковая панель -->
    <div class="w-1/3 border-r border-white/10 p-4 flex flex-col justify-between bg-[#121214]">
      <div class="flex flex-col h-full overflow-hidden">
        
        <!-- Монолитный блочек с Моим ID слева -->
        <div class="flex items-center gap-2 mb-4 flex-shrink-0">
          <span class="text-xs font-semibold text-gray-400 tracking-wider uppercase">Мой ID:</span>
          <span id="my-id-display" class="font-mono bg-white/10 text-white px-2.5 py-1 rounded-lg text-sm font-bold border border-white/10">------</span>
        </div>
        
        <h2 class="text-3xl font-bold text-white mb-4 flex-shrink-0 tracking-tight">Message</h2>
        
        <!-- Поле и кнопка открытия нового чата -->
        <div class="space-y-2.5 mb-4 flex-shrink-0">
          <input id="target-id" type="text" maxlength="6" placeholder="ID собеседника..." class="w-full px-4 py-2.5 rounded-xl border border-white/10 bg-white/5 text-sm focus:outline-none focus:border-[#007aff] font-mono text-white">
          <button onclick="handleManualStartChat()" class="w-full bg-[#007aff] hover:bg-blue-600 text-white text-sm py-2.5 rounded-xl transition font-medium">Открыть чат</button>
        </div>

        <!-- Список диалогов -->
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 flex-shrink-0">Диалоги</div>
        <div id="recent-chats-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1">
          <!-- Динамический список диалогов -->
        </div>
      </div>

      <button onclick="location.reload()" class="text-red-400 hover:text-red-300 text-sm font-medium text-left transition pt-3 flex-shrink-0 border-t border-white/10">Выйти</button>
    </div>

    <!-- Область диалога -->
    <div class="w-2/3 flex flex-col justify-between bg-black">
      <div class="p-4 border-b border-white/10 bg-[#121214] flex items-center">
        <span class="text-sm font-medium text-gray-400">Собеседник: </span>
        <span id="active-chat-id" class="ml-2 font-mono font-bold text-white">Не выбран</span>
      </div>

      <div id="messages-container" class="p-4 overflow-y-auto flex-1 space-y-2">
        <div class="text-center text-gray-500 text-sm mt-10">Выберите диалог слева или введите ID собеседника</div>
      </div>

      <div class="p-4 border-t border-white/10 bg-[#121214] flex gap-2 items-center">
        <input id="message-input" type="text" placeholder="iMessage" class="flex-1 px-4 py-2.5 rounded-full border border-white/20 bg-white/5 focus:outline-none focus:border-[#007aff] text-sm text-white placeholder-gray-500" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" class="bg-[#007aff] hover:bg-blue-600 text-white px-5 py-2.5 rounded-full text-sm font-medium transition flex items-center justify-center">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myId = null;
    let currentChatId = null;
    
    // Хранение данных чатов: { chatId: { unread: Boolean, lastText: String } }
    const activeChats = {};

    function showAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
      clearError();
    }

    function hideAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function validateEnglishPassword(password) {
      return /^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+$/.test(password);
    }

    async function register() {
      clearError();
      const password = document.getElementById('auth-password').value;
      if (!password) return showError('Введите пароль');
      if (!validateEnglishPassword(password)) {
        return showError('Пароль должен содержать только английские буквы и символы');
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.error) return showError(data.error);

        myId = data.id;
        alert(`Ваш ID: ${myId}`);
        await openChatScreen();
      } catch (e) {
        showError('Ошибка соединения');
      }
    }

    async function login() {
      clearError();
      const id = document.getElementById('auth-id').value.trim();
      const password = document.getElementById('auth-password').value;

      if (!id || !password) return showError('Заполните все поля');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, password })
        });
        const data = await res.json();
        if (data.error) return showError(data.error);

        myId = data.id;
        await openChatScreen();
      } catch (e) {
        showError('Ошибка соединения');
      }
    }

    async function openChatScreen() {
      document.getElementById('landing-screen').classList.add('hidden');
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('my-id-display').innerText = myId;
      
      socket.emit('register_socket', myId);
      await loadChatList();
    }

    async function loadChatList() {
      try {
        const res = await fetch(`/api/messages/${myId}/all`);
        const messages = await res.json();

        if (Array.isArray(messages)) {
          messages.forEach(msg => {
            const partnerId = msg.sender_id === myId ? msg.receiver_id : msg.sender_id;
            if (!activeChats[partnerId]) {
              activeChats[partnerId] = { unread: false, lastText: msg.text };
            } else {
              activeChats[partnerId].lastText = msg.text;
            }
          });
          renderRecentChatsList();
        }
      } catch (e) {
        console.error('Ошибка загрузки историй:', e);
      }
    }

    function handleManualStartChat() {
      const targetId = document.getElementById('target-id').value.trim();
      if (!targetId || targetId === myId) return alert('Введите корректный ID собеседника');
      
      openChatWith(targetId);
      document.getElementById('target-id').value = '';
    }

    async function openChatWith(targetId) {
      currentChatId = targetId;
      document.getElementById('active-chat-id').innerText = currentChatId;

      if (!activeChats[targetId]) {
        activeChats[targetId] = { unread: false, lastText: '' };
      } else {
        activeChats[targetId].unread = false;
      }

      renderRecentChatsList();

      const res = await fetch(`/api/messages/${myId}/${currentChatId}`);
      const messages = await res.json();

      renderMessages(messages || []);
    }

    function renderRecentChatsList() {
      const listContainer = document.getElementById('recent-chats-list');
      listContainer.innerHTML = '';

      Object.keys(activeChats).forEach(chatId => {
        const chatData = activeChats[chatId];
        const isActive = chatId === currentChatId;

        const chatItem = document.createElement('div');
        chatItem.onclick = () => openChatWith(chatId);
        chatItem.className = `p-3 rounded-xl transition cursor-pointer flex items-center justify-between ${
          isActive 
            ? 'bg-white/15 text-white' 
            : 'hover:bg-white/5 text-gray-300'
        }`;

        chatItem.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden">
            <!-- Синяя точка слева от ID при непрочитанных -->
            ${chatData.unread ? '<span class="w-2.5 h-2.5 rounded-full bg-[#007aff] flex-shrink-0"></span>' : '<span class="w-2.5 h-2.5 invisible flex-shrink-0"></span>'}
            <div class="overflow-hidden">
              <div class="font-mono font-bold text-sm text-white leading-tight">
                ${chatId}
              </div>
              <div class="text-xs text-gray-400 truncate mt-0.5">
                ${chatData.lastText || 'Сообщение'}
              </div>
            </div>
          </div>
        `;

        listContainer.appendChild(chatItem);
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return alert('Выберите собеседника');

      socket.emit('send_message', {
        sender_id: myId,
        receiver_id: currentChatId,
        text: text
      });

      input.value = '';
    }

    socket.on('message_sent', (msg) => {
      const targetId = msg.receiver_id;
      if (!activeChats[targetId]) {
        activeChats[targetId] = { unread: false, lastText: msg.text };
      } else {
        activeChats[targetId].lastText = msg.text;
      }

      if (targetId === currentChatId) {
        addSingleMessageUI(msg, true, 'Доставлено');
      }
      
      renderRecentChatsList();
    });

    socket.on('receive_message', (msg) => {
      const senderId = msg.sender_id;

      if (!activeChats[senderId]) {
        activeChats[senderId] = { unread: false, lastText: msg.text };
      }

      activeChats[senderId].lastText = msg.text;

      if (currentChatId === senderId) {
        addSingleMessageUI(msg, false);
      } else {
        activeChats[senderId].unread = true;
      }

      renderRecentChatsList();
    });

    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      messages.forEach((msg, index) => {
        const isMe = msg.sender_id === myId;
        const isLast = index === messages.length - 1;
        const status = (isMe && isLast) ? 'Прочитано' : null;
        addSingleMessageUI(msg, isMe, status);
      });
    }

    function addSingleMessageUI(msg, isMe, statusText = null) {
      const container = document.getElementById('messages-container');

      // Удаляем старые подписи статуса "Доставлено" / "Прочитано"
      const oldStatuses = container.querySelectorAll('.status-label');
      oldStatuses.forEach(el => el.remove());

      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

      const bubble = document.createElement('div');
      bubble.className = `max-w-[70%] px-4 py-2 rounded-2xl text-[15px] leading-snug ${
        isMe 
          ? 'imessage-blue rounded-br-sm' 
          : 'imessage-gray rounded-bl-sm'
      }`;
      bubble.innerText = msg.text;

      wrapper.appendChild(bubble);

      if (statusText && isMe) {
        const status = document.createElement('span');
        status.className = 'status-label text-[10px] text-gray-500 mt-1 mr-1 font-medium';
        status.innerText = statusText;
        wrapper.appendChild(status);
      }

      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function showError(msg) {
      const err = document.getElementById('auth-error');
      err.innerText = msg;
      err.classList.remove('hidden');
    }

    function clearError() {
      const err = document.getElementById('auth-error');
      err.innerText = '';
      err.classList.add('hidden');
    }
  </script>
</body>
</html>
