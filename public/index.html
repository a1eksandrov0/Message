<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Message</title>
<style>
  :root {
    --bg: #000;
    --bg-3: #1c1c1e;
    --bg-4: #2c2c2e;
    --separator: rgba(255,255,255,0.08);
    --separator-strong: rgba(255,255,255,0.14);

    --text: #ffffff;
    --text-2: #8e8e93;
    --text-3: #636366;

    --blue: #0a84ff;
    --blue-ios: #007aff;
    --green: #30d158;
    --red: #ff453a;

    --bubble-me: linear-gradient(180deg, #0a84ff 0%, #0066ff 100%);
    --bubble-other: rgba(38, 38, 42, 0.92);

    --glass-2: rgba(22, 22, 24, 0.78);

    --ease: cubic-bezier(.22, 1, .36, 1);
    --sidebar-w: 320px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  button, input, textarea {
    font: inherit;
    color: inherit;
    letter-spacing: inherit;
  }
  button { cursor: pointer; border: 0; background: transparent; }
  textarea { font-family: inherit; }

  /* ============ FON ============ */
  .app-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #000; }
  .app-bg::before, .app-bg::after {
    content: ""; position: absolute; border-radius: 50%;
    filter: blur(120px); opacity: 0.55; pointer-events: none;
  }
  .app-bg::before {
    width: 60vmax; height: 60vmax; top: -20vmax; left: -10vmax;
    background: radial-gradient(circle, #0a84ff 0%, transparent 65%);
  }
  .app-bg::after {
    width: 55vmax; height: 55vmax; bottom: -25vmax; right: -15vmax;
    background: radial-gradient(circle, #5856d6 0%, transparent 65%);
  }

  /* ============ ЭКРАНЫ ============ */
  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ============ АВТОРИЗАЦИЯ ============ */
  #auth-screen {
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-card {
    width: min(100%, 400px);
    padding: 36px 28px 30px;
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(180deg, rgba(60,60,64,0.55), rgba(22,22,24,0.85));
    box-shadow:
      0 40px 120px rgba(0,0,0,0.75),
      inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    animation: card-in 0.55s var(--ease) both;
  }

  /* Логотип убран — только текст "Message" */
  .auth-brand {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #fff;
    margin: 0 0 26px;
  }

  .field-group { display: grid; gap: 12px; margin-bottom: 10px; }

  /* ============ FLOATING LABEL INPUT ============ */
  .float-field {
    position: relative;
    height: 58px;
  }

  .float-field input {
    width: 100%;
    height: 100%;
    padding: 22px 16px 8px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    background: rgba(118,118,128,0.18);
    color: #fff;
    outline: none;
    font-size: 16px;
    transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
  }

  .float-field input:hover { background: rgba(118,118,128,0.22); }

  .float-field input:focus {
    border-color: rgba(10,132,255,0.9);
    background: rgba(118,118,128,0.26);
    box-shadow: 0 0 0 3px rgba(10,132,255,0.18);
  }

  /* Лейбл внутри поля */
  .float-field label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(235,235,245,0.55);
    font-size: 16px;
    pointer-events: none;
    transition: all 0.18s var(--ease);
    transform-origin: left top;
    background: transparent;
    padding: 0 4px;
    margin-left: -4px;
  }

  /* Активное состояние — лейбл съезжает вверх и уменьшается */
  .float-field input:focus + label,
  .float-field input:not(:placeholder-shown) + label,
  .float-field input.filled + label {
    top: 8px;
    transform: translateY(0) scale(0.78);
    color: var(--blue);
  }

  /* Для поля с паролем отступ справа под кнопку глаза */
  .float-field.has-eye input { padding-right: 48px; }

  .password-toggle {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--text-2);
    transition: color 0.15s, background 0.15s;
  }
  .password-toggle:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .password-toggle svg { width: 20px; height: 20px; }

  /* ============ ПЛАШКА "Данные аккаунта..." ============ */
  .privacy-plate {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 16px 0 8px;
    padding: 12px 14px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
  }

  .privacy-lock {
    flex: 0 0 34px;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(10,132,255,0.18), rgba(88,86,214,0.14));
    position: relative;
    overflow: hidden;
  }

  /* Светящийся SVG-замок с переливающимся градиентом */
  .privacy-lock svg {
    width: 20px; height: 20px;
    color: #7ab8ff;
    filter: drop-shadow(0 0 6px rgba(10,132,255,0.55));
    animation: lockGlow 3s ease-in-out infinite;
  }

  .privacy-lock::after {
    content: "";
    position: absolute;
    inset: -40%;
    background: conic-gradient(from 0deg,
      rgba(10,132,255,0.0) 0deg,
      rgba(10,132,255,0.55) 90deg,
      rgba(88,86,214,0.55) 180deg,
      rgba(10,132,255,0.0) 300deg,
      rgba(10,132,255,0.0) 360deg);
    animation: spinSlow 6s linear infinite;
    opacity: 0.55;
    pointer-events: none;
    mask: radial-gradient(circle, transparent 38%, #000 70%);
    -webkit-mask: radial-gradient(circle, transparent 38%, #000 70%);
  }
  .privacy-lock svg { position: relative; z-index: 1; }

  .privacy-text {
    flex: 1;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-2);
  }

  /* ============ КНОПКИ ============ */
  .btn {
    width: 100%;
    height: 52px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 16px;
    transition: transform 0.15s var(--ease), background 0.15s, opacity 0.15s, filter 0.15s;
  }
  .btn:active { transform: scale(0.975); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; }

  .btn-primary {
    background: linear-gradient(180deg, #0a84ff, #0066ff);
    color: #fff;
    box-shadow:
      0 10px 24px rgba(10, 132, 255, 0.30),
      inset 0 1px 0 rgba(255,255,255,0.25);
    margin-top: 16px;
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

  .btn-link {
    margin: 16px auto 0;
    display: block;
    color: var(--blue-ios);
    font-size: 14px;
    font-weight: 500;
    padding: 6px 10px;
    width: fit-content;
  }

  .alert {
    display: none;
    margin-bottom: 14px;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.4;
    border: 1px solid rgba(255, 69, 58, 0.25);
    background: rgba(255, 69, 58, 0.10);
    color: #ff6961;
  }
  .alert.show { display: block; animation: shake 0.35s; }
  .alert.success {
    border-color: rgba(48, 209, 88, 0.25);
    background: rgba(48, 209, 88, 0.10);
    color: #3ddb6b;
  }

  /* ============ MAIN LAYOUT ============ */
  #main-screen {
    flex-direction: row;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
  }

  .sidebar {
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    display: flex;
    flex-direction: column;
    background: var(--glass-2);
    border-right: 1px solid var(--separator);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    position: relative;
    z-index: 2;
  }

  .sidebar-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px;
  }

  .avatar-me {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5e5ce6, #0a84ff);
    display: grid; place-items: center;
    color: #fff; font-size: 14px; font-weight: 600;
    flex: 0 0 34px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    cursor: pointer;
    user-select: none;
  }

  .me-meta { flex: 1; min-width: 0; line-height: 1.15; }
  .me-meta b {
    font-size: 14px; font-weight: 600; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .me-meta span {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--text-2); letter-spacing: 0.05em;
  }

  .header-action {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--blue-ios);
    transition: background 0.15s, transform 0.15s;
  }
  .header-action:hover { background: rgba(255,255,255,0.08); }
  .header-action:active { transform: scale(0.92); }
  .header-action svg { width: 20px; height: 20px; }

  .sidebar-search { padding: 0 12px 10px; }

  .search {
    display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 10px;
    border-radius: 10px;
    background: rgba(118, 118, 128, 0.20);
    color: var(--text-2);
  }
  .search svg { width: 15px; height: 15px; flex: 0 0 15px; }
  .search input {
    flex: 1; border: 0; outline: 0;
    background: transparent; color: #fff; font-size: 14px;
  }
  .search input::placeholder { color: var(--text-3); }

  .chat-list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 8px 20px;
  }
  .chat-list::-webkit-scrollbar { width: 0; }

  .chat-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .chat-row:hover { background: rgba(255,255,255,0.05); }
  .chat-row.active {
    background: linear-gradient(180deg, #0a84ff, #0066ff);
    box-shadow:
      0 8px 22px rgba(10,132,255,0.25),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .chat-row.active .chat-last,
  .chat-row.active .chat-time { color: rgba(255,255,255,0.85); }

  .avatar {
    flex: 0 0 46px;
    width: 46px; height: 46px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, #5e5ce6, #0a84ff);
    user-select: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.20);
    text-transform: uppercase;
  }

  .chat-info { flex: 1; min-width: 0; }
  .chat-name {
    font-size: 14.5px; font-weight: 600;
    letter-spacing: -0.01em; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-last {
    font-size: 13px; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .chat-side {
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 5px;
    flex: 0 0 auto; margin-left: 6px;
  }
  .chat-time { font-size: 12px; color: var(--text-2); }

  .badge-unread {
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px;
    background: var(--blue); color: #fff;
    font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
  }
  .chat-row.active .badge-unread { background: #fff; color: var(--blue); }

  .empty {
    padding: 60px 24px; text-align: center;
    color: var(--text-2); font-size: 13.5px; line-height: 1.5;
  }

  /* ============ CHAT PANE ============ */
  .chat-pane {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(10,132,255,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(88,86,214,0.06), transparent 60%),
      #000;
    position: relative; overflow: hidden;
  }

  .chat-header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--separator);
    background: rgba(22, 22, 24, 0.70);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    z-index: 3;
    padding-top: calc(12px + env(safe-area-inset-top));
  }

  .back-btn {
    display: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    color: var(--blue-ios);
    place-items: center; margin-right: 4px;
  }
  .back-btn svg { width: 22px; height: 22px; }

  .chat-header .avatar { flex: 0 0 36px; width: 36px; height: 36px; font-size: 15px; }

  .chat-header-meta { flex: 1; min-width: 0; line-height: 1.15; }
  .chat-header-meta b {
    font-size: 15px; font-weight: 600; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-header-meta span {
    font-size: 12px; color: var(--text-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.05em;
  }

  .chat-header-action {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--blue-ios);
  }
  .chat-header-action:hover { background: rgba(255,255,255,0.08); }
  .chat-header-action svg { width: 19px; height: 19px; }

  .messages {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 20px 22px;
    display: flex; flex-direction: column; gap: 3px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .msg-row {
    display: flex; justify-content: flex-start;
    padding: 1px 4px;
    animation: msg-in 0.22s var(--ease);
  }
  .msg-row.me { justify-content: flex-end; }

  .bubble-wrap {
    max-width: 62%;
    display: flex; flex-direction: column;
    align-items: flex-start;
  }
  .msg-row.me .bubble-wrap { align-items: flex-end; }

  .bubble {
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 15.5px; line-height: 1.32;
    word-wrap: break-word; word-break: break-word;
    white-space: pre-wrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }

  .msg-row:not(.me) .bubble {
    background: var(--bubble-other);
    color: #fff;
    border-bottom-left-radius: 6px;
    backdrop-filter: blur(10px);
  }
  .msg-row.me .bubble {
    background: var(--bubble-me);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow:
      0 2px 6px rgba(10,132,255,0.25),
      inset 0 1px 0 rgba(255,255,255,0.18);
  }

  .status {
    margin-top: 3px; font-size: 11px;
    color: var(--text-2);
    display: flex; align-items: center; gap: 4px;
    letter-spacing: 0.01em; user-select: none;
  }
  .status.read { color: var(--blue); }
  .status svg { width: 12px; height: 12px; }

  .msg-time {
    font-size: 11.5px; color: var(--text-2);
    text-align: center; margin: 16px 0 8px;
    font-weight: 500; letter-spacing: 0.02em;
  }
  .msg-time b { font-weight: 600; color: var(--text-3); }

  /* ============ COMPOSER ============ */
  .composer {
    flex: 0 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--separator);
    background: rgba(22, 22, 24, 0.72);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
  }

  .composer-input {
    flex: 1;
    min-height: 36px;
    max-height: 160px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    background: rgba(118,118,128,0.16);
    color: #fff;
    outline: none;
    font-size: 15.5px; line-height: 1.35;
    resize: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .composer-input:focus {
    border-color: rgba(10,132,255,0.55);
    background: rgba(118,118,128,0.22);
  }
  .composer-input::placeholder { color: var(--text-3); }

  .send-btn {
    flex: 0 0 32px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(180deg, #0a84ff, #0066ff);
    display: grid; place-items: center;
    color: #fff;
    transition: transform 0.15s, opacity 0.15s, filter 0.15s;
    align-self: flex-end;
    margin-bottom: 3px;
    box-shadow:
      0 4px 12px rgba(10,132,255,0.35),
      inset 0 1px 0 rgba(255,255,255,0.30);
  }
  .send-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .send-btn:disabled { opacity: 0.4; transform: scale(0.9); box-shadow: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .pane-empty {
    flex: 1; display: grid; place-items: center;
    text-align: center; color: var(--text-2); padding: 24px;
  }
  .pane-empty-inner { max-width: 320px; }
  .pane-empty-icon {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.08);
    display: grid; place-items: center;
    margin: 0 auto 18px;
    color: var(--text-2);
  }
  .pane-empty-icon svg { width: 34px; height: 34px; }
  .pane-empty h3 {
    margin: 0 0 6px; font-size: 18px; font-weight: 700;
    color: #fff; letter-spacing: -0.02em;
  }
  .pane-empty p { margin: 0; font-size: 14px; line-height: 1.45; }

  /* ============ SHEETS ============ */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .sheet-backdrop.active { display: flex; }

  .sheet {
    width: min(100%, 360px);
    padding: 24px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(50,50,54,0.92), rgba(22,22,24,0.94));
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    animation: card-in 0.3s var(--ease);
  }
  .sheet h3 {
    margin: 0 0 6px; font-size: 19px; font-weight: 700;
    text-align: center; letter-spacing: -0.02em;
  }
  .sheet p {
    margin: 0 0 16px; font-size: 13px;
    color: var(--text-2); text-align: center; line-height: 1.45;
  }
  .sheet .input {
    width: 100%; height: 50px;
    padding: 0 16px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    background: rgba(118,118,128,0.20);
    color: #fff; outline: none;
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.15em;
    font-size: 20px; font-weight: 700;
    color: var(--blue);
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .sheet .input:focus {
    border-color: rgba(10, 132, 255, 0.9);
    background: rgba(118, 118, 128, 0.26);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.18);
  }
  .sheet .input::placeholder { color: rgba(235, 235, 245, 0.35); }
  .sheet .btn-primary { margin-top: 14px; }

  .avatar-preview {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin: 4px 0 16px;
    color: var(--text-2); font-size: 14px;
  }
  .avatar-preview .avatar { flex: 0 0 52px; width: 52px; height: 52px; font-size: 20px; }

  .sheet-input {
    width: 100%; height: 50px;
    padding: 0 16px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    background: rgba(118,118,128,0.20);
    color: #fff; outline: none;
    font-size: 15px;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    margin-bottom: 10px;
  }
  .sheet-input:focus {
    border-color: rgba(10, 132, 255, 0.9);
    background: rgba(118, 118, 128, 0.26);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.18);
  }

  /* ============ ANIMATIONS ============ */
  @keyframes card-in {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes lockGlow {
    0%, 100% {
      filter: drop-shadow(0 0 5px rgba(10,132,255,0.45));
      color: #7ab8ff;
    }
    50% {
      filter: drop-shadow(0 0 12px rgba(120,180,255,0.95));
      color: #b7d6ff;
    }
  }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
    margin-right: 6px;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 820px) {
    #main-screen { position: relative; display: block; }
    .sidebar {
      position: absolute; inset: 0;
      width: 100%; flex: 1 1 100%;
      border-right: 0;
      transition: transform 0.32s var(--ease);
      padding-top: env(safe-area-inset-top);
    }
    .chat-pane {
      position: absolute; inset: 0;
      transform: translateX(100%);
      transition: transform 0.32s var(--ease);
    }
    #main-screen.chat-open .sidebar { transform: translateX(-30%); }
    #main-screen.chat-open .chat-pane { transform: translateX(0); }
    .back-btn { display: grid; }
    .bubble-wrap { max-width: 78%; }
    .sidebar-header { padding-top: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app-bg" aria-hidden="true"></div>

<!-- ================= АВТОРИЗАЦИЯ ================= -->
<div class="screen active" id="auth-screen">
  <div class="auth-card">
    <h1 class="auth-brand">Message</h1>

    <div id="auth-alert" class="alert"></div>

    <!-- LOGIN -->
    <section id="view-login">
      <div class="field-group">
        <div class="float-field">
          <input id="login-id" type="text" inputmode="numeric" maxlength="6"
            placeholder=" " autocomplete="username">
          <label for="login-id">Ваш уникальный ID</label>
        </div>
      </div>

      <div class="privacy-plate">
        <div class="privacy-lock" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2.5"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
        </div>
        <div class="privacy-text">
          Данные аккаунта используются для безопасной авторизации и работы Message
        </div>
      </div>

      <button class="btn btn-primary" id="login-btn" type="button" onclick="doLogin()">
        Продолжить
      </button>

      <button class="btn-link" type="button" onclick="showRegister()">
        Создание Аккаунта message
      </button>
    </section>

    <!-- REGISTER -->
    <section id="view-register" style="display:none">
      <div class="field-group" style="margin-bottom:14px">
        <div class="float-field">
          <input id="reg-id" type="text" readonly placeholder=" ">
          <label for="reg-id">Ваш уникальный ID</label>
        </div>

        <div class="float-field">
          <input id="reg-name" type="text" placeholder=" " maxlength="40">
          <label for="reg-name">Имя (необязательно)</label>
        </div>

        <div class="float-field has-eye">
          <input id="reg-password" type="password" placeholder=" "
            autocomplete="new-password"
            onkeydown="handleEnter(event, doRegister)">
          <label for="reg-password">Пароль</label>
          <button class="password-toggle" type="button"
            onclick="togglePassword('reg-password', this)"></button>
        </div>
      </div>

      <button class="btn btn-primary" id="register-btn" type="button" onclick="doRegister()">
        Создать и войти
      </button>

      <button class="btn-link" type="button" onclick="showLogin()">
        У меня уже есть аккаунт
      </button>
    </section>
  </div>
</div>

<!-- ================= MAIN ================= -->
<div class="screen" id="main-screen">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="avatar-me" id="me-avatar" onclick="openProfile()">?</div>
      <div class="me-meta">
        <b id="me-name">—</b>
        <span id="me-id-label">ID: —</span>
      </div>
      <button class="header-action" type="button" onclick="openNewChat()" title="Новый чат">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-search">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search-input" type="text" placeholder="Поиск" oninput="renderChats()">
      </div>
    </div>

    <div class="chat-list" id="chat-list"></div>
  </aside>

  <section class="chat-pane" id="chat-pane">
    <div class="pane-empty" id="pane-empty">
      <div class="pane-empty-inner">
        <div class="pane-empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M21 12a9 9 0 1 1-4.4-7.7"/>
            <path d="M21 4v5h-5"/>
          </svg>
        </div>
        <h3>Выберите чат</h3>
        <p>Откройте диалог слева или начните новый по ID<br>кнопкой <b>＋</b> в шапке.</p>
      </div>
    </div>

    <div id="active-chat" style="display:none; flex:1; flex-direction:column; min-height:0;">

      <div class="chat-header">
        <button class="back-btn" type="button" onclick="backToList()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div class="avatar" id="chat-avatar">?</div>
        <div class="chat-header-meta">
          <b id="chat-with-name">—</b>
          <span id="chat-with-id">ID: —</span>
        </div>
        <button class="chat-header-action" type="button" onclick="openChatInfo()" title="Информация">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
        </button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <textarea id="msg-input" class="composer-input" rows="1"
          placeholder="Текстовое сообщение" oninput="autoGrow(this)"
          onkeydown="handleComposerKey(event)"></textarea>
        <button class="send-btn" id="send-btn" type="button" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

</div>

<!-- ================= NEW CHAT ================= -->
<div class="sheet-backdrop" id="new-chat-backdrop" onclick="if(event.target===this)closeNewChat()">
  <div class="sheet">
    <h3>Новый чат</h3>
    <p>Введите ID пользователя (6 цифр)</p>
    <input id="new-chat-id" class="input" type="text" inputmode="numeric"
      maxlength="6" placeholder="000000"
      onkeydown="handleEnter(event, startChatByID)">
    <button class="btn btn-primary" type="button" onclick="startChatByID()">Найти</button>
    <button class="btn-link" type="button" onclick="closeNewChat()">Отмена</button>
  </div>
</div>

<!-- ================= PROFILE ================= -->
<div class="sheet-backdrop" id="profile-backdrop" onclick="if(event.target===this)closeProfile()">
  <div class="sheet">
    <h3>Профиль</h3>
    <div class="avatar-preview">
      <div class="avatar" id="profile-avatar">?</div>
      <div>
        <div style="color:#fff;font-weight:600;font-size:15px" id="profile-name">—</div>
        <div style="font-family:ui-monospace,monospace;font-size:12px;letter-spacing:0.05em" id="profile-id">ID: —</div>
      </div>
    </div>
    <input id="profile-name-input" class="sheet-input" type="text" placeholder="Ваше имя" maxlength="40">
    <button class="btn btn-primary" type="button" onclick="saveName()">Сохранить имя</button>
    <button class="btn-link" type="button" onclick="logout()" style="color:#ff6961">Выйти из аккаунта</button>
    <button class="btn-link" type="button" onclick="closeProfile()">Закрыть</button>
  </div>
</div>

<!-- ================= CHAT INFO ================= -->
<div class="sheet-backdrop" id="chat-info-backdrop" onclick="if(event.target===this)closeChatInfo()">
  <div class="sheet">
    <div class="avatar-preview">
      <div class="avatar" id="info-avatar">?</div>
      <div style="text-align:left">
        <div style="color:#fff;font-weight:600;font-size:15px" id="info-name">—</div>
        <div style="font-family:ui-monospace,monospace;font-size:12px;letter-spacing:0.05em" id="info-id">ID: —</div>
      </div>
    </div>
    <button class="btn btn-primary" type="button" onclick="closeChatInfo()">Закрыть</button>
  </div>
</div>

<script>
/* ============ STATE ============ */
const state = {
  me: null,
  chats: [],
  current: null,
  refreshTimer: null,
  pollTimer: null,
  lastMsgCount: 0,
};

const $ = (id) => document.getElementById(id);
const isNarrow = () => window.matchMedia("(max-width: 820px)").matches;

/* ============ ICONS ============ */
const EYE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7s-3.5 7-10 7c-1.5 0-2.8-.4-4-.9"/><path d="M6.6 6.6C3.7 8.3 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.4 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
const CHECK_ONE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"/></svg>`;
const CHECK_TWO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5 6 17l9-10"/><path d="m10 12.5 1.5 4 9-10"/></svg>`;

document.querySelectorAll(".password-toggle").forEach(b => b.innerHTML = EYE);

/* ============ HELPERS ============ */
function alertBox(msg, success = false) {
  const el = $("auth-alert");
  el.textContent = msg;
  el.classList.toggle("success", success);
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}
function hideAlert() { $("auth-alert").classList.remove("show"); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function togglePassword(id, btn) {
  const input = $(id);
  const visible = input.type === "text";
  input.type = visible ? "password" : "text";
  btn.innerHTML = visible ? EYE : EYE_OFF;
}

function handleEnter(e, fn) {
  if (e.key === "Enter") { e.preventDefault(); fn(); }
}

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
  $("send-btn").disabled = !el.value.trim();
}

function handleComposerKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function fmtListTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  const diff = (now - d) / 86400000;
  if (diff < 7) return d.toLocaleDateString("ru-RU", { weekday: "short" });
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
}

function initials(name) {
  if (!name) return "?";
  const t = String(name).trim();
  return t.charAt(0).toUpperCase() || "?";
}

/* ============ AUTH ============ */
function showLogin() {
  hideAlert();
  $("view-register").style.display = "none";
  $("view-login").style.display = "";
  setTimeout(() => $("login-id").focus(), 100);
}

async function showRegister() {
  hideAlert();
  $("view-login").style.display = "none";
  $("view-register").style.display = "";
  $("reg-id").value = "";
  $("reg-id").classList.remove("filled");
  try {
    const r = await fetch("/api/generate-id");
    const d = await r.json();
    $("reg-id").value = d.id;
    $("reg-id").classList.add("filled");
  } catch {
    alertBox("Не удалось создать ID. Попробуйте позже.");
  }
  setTimeout(() => $("reg-name").focus(), 100);
}

async function doLogin() {
  hideAlert();
  const id = $("login-id").value.trim();

  if (!/^\d{6}$/.test(id)) return alertBox("ID должен состоять из 6 цифр.");

  const btn = $("login-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Проверка…`;

  try {
    // сначала проверим, существует ли пользователь
    const r = await fetch("/api/user/" + id);
    if (!r.ok) throw new Error("Пользователь с таким ID не найден");
    const u = await r.json();
    showPasswordStep(id, u.name);
  } catch (e) {
    alertBox(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Продолжить";
  }
}

/* Второй шаг: ввод пароля. Подменяем секцию логина на секцию с паролем. */
let pendingLogin = null;
function showPasswordStep(id, name) {
  hideAlert();
  pendingLogin = { id, name };

  const section = $("view-login");
  section.innerHTML = `
    <div class="field-group">
      <div class="float-field">
        <input id="login-password" type="password" placeholder=" "
          autocomplete="current-password"
          onkeydown="handleEnter(event, doLoginPassword)">
        <label for="login-password">Пароль</label>
      </div>
    </div>
    <button class="btn btn-primary" id="password-btn" type="button" onclick="doLoginPassword()">
      Продолжить
    </button>
    <button class="btn-link" type="button" onclick="resetLoginForm()">
      Назад
    </button>
  `;
  setTimeout(() => $("login-password").focus(), 100);
}

async function doLoginPassword() {
  hideAlert();
  if (!pendingLogin) return;
  const password = $("login-password").value;
  if (!password) return alertBox("Введите пароль.");

  const btn = $("password-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Вход…`;

  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: pendingLogin.id, password })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Ошибка входа");
    state.me = { id: d.id, name: d.name, password };
    persist();
    enterMessenger();
  } catch (e) {
    alertBox(e.message);
    btn.disabled = false;
    btn.textContent = "Продолжить";
  }
}

function resetLoginForm() {
  hideAlert();
  pendingLogin = null;
  const section = $("view-login");
  section.innerHTML = `
    <div class="field-group">
      <div class="float-field">
        <input id="login-id" type="text" inputmode="numeric" maxlength="6"
          placeholder=" " autocomplete="username">
        <label for="login-id">Ваш уникальный ID</label>
      </div>
    </div>

    <div class="privacy-plate">
      <div class="privacy-lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2.5"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <div class="privacy-text">
        Данные аккаунта используются для безопасной авторизации и работы Message
      </div>
    </div>

    <button class="btn btn-primary" id="login-btn" type="button" onclick="doLogin()">
      Продолжить
    </button>

    <button class="btn-link" type="button" onclick="showRegister()">
      Создание Аккаунта message
    </button>
  `;
  setTimeout(() => $("login-id").focus(), 100);
}

async function doRegister() {
  hideAlert();
  const id = $("reg-id").value.trim();
  const name = $("reg-name").value.trim();
  const password = $("reg-password").value;

  if (!/^\d{6}$/.test(id)) return alertBox("ID ещё не готов. Подождите.");
  if (password.length < 6) return alertBox("Пароль минимум 6 символов.");

  const btn = $("register-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Создание…`;

  try {
    const r = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, password })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Ошибка регистрации");

    if (name) {
      await fetch("/api/user/name", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, password, name })
      });
    }

    state.me = { id, name: name || ("Пользователь " + id), password };
    persist();
    enterMessenger();
  } catch (e) {
    alertBox(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Создать и войти";
  }
}

function logout() {
  stopTimers();
  try { localStorage.removeItem("message.me"); } catch {}
  state.me = null;
  state.current = null;
  state.chats = [];
  state.lastMsgCount = 0;
  pendingLogin = null;
  closeProfile();
  closeChatInfo();
  showScreen("auth-screen");
  resetLoginForm();
}

/* ============ PERSIST ============ */
function persist() {
  try { localStorage.setItem("message.me", JSON.stringify(state.me)); } catch {}
}
function restore() {
  try {
    const raw = localStorage.getItem("message.me");
    if (!raw) return false;
    const me = JSON.parse(raw);
    if (me && me.id && me.password) { state.me = me; return true; }
  } catch {}
  return false;
}

/* ============ MESSENGER ============ */
function enterMessenger() {
  $("me-avatar").textContent = initials(state.me.name);
  $("me-name").textContent = state.me.name || "—";
  $("me-id-label").textContent = "ID: " + state.me.id;

  showScreen("main-screen");
  closeActiveChat(false);
  loadChats();
  startTimers();
}

function startTimers() {
  stopTimers();
  state.refreshTimer = setInterval(loadChats, 4000);
  state.pollTimer = setInterval(() => {
    if (state.current) loadMessages(state.current.id);
  }, 2000);
}
function stopTimers() {
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.refreshTimer = null;
  state.pollTimer = null;
}

/* ============ CHAT LIST ============ */
async function loadChats() {
  if (!state.me) return;
  try {
    const r = await fetch("/api/chats/" + state.me.id);
    const list = await r.json();
    state.chats = Array.isArray(list) ? list : [];
    renderChats();
  } catch {}
}

function renderChats() {
  const list = $("chat-list");
  const q = ($("search-input").value || "").trim().toLowerCase();

  const items = state.chats.filter(c => {
    if (!q) return true;
    return (c.name || "").toLowerCase().includes(q) || c.with.includes(q);
  });

  if (!items.length) {
    list.innerHTML = `<div class="empty">${q ? "Ничего не найдено" : "Нет чатов.<br>Нажмите ＋ вверху, чтобы начать диалог по ID."}</div>`;
    return;
  }

  list.innerHTML = items.map(c => {
    const active = state.current && state.current.id === c.with;
    const preview = c.last
      ? (c.lastFromMe ? "Вы: " + c.last : c.last)
      : "Нет сообщений";
    return `
      <div class="chat-row ${active ? "active" : ""}" onclick="openChat('${c.with}', '${escapeAttr(c.name)}')">
        <div class="avatar">${escapeHtml(initials(c.name))}</div>
        <div class="chat-info">
          <div class="chat-name">${escapeHtml(c.name)}</div>
          <div class="chat-last">${escapeHtml(preview)}</div>
        </div>
        <div class="chat-side">
          <div class="chat-time">${fmtListTime(c.time)}</div>
          ${c.unread ? `<div class="badge-unread">${c.unread}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

/* ============ CONVERSATION ============ */
function openChat(id, name) {
  state.current = { id, name };
  state.lastMsgCount = 0;

  $("pane-empty").style.display = "none";
  $("active-chat").style.display = "flex";

  $("chat-avatar").textContent = initials(name);
  $("chat-with-name").textContent = name;
  $("chat-with-id").textContent = "ID: " + id;

  if (isNarrow()) $("main-screen").classList.add("chat-open");

  $("messages").innerHTML = "";
  loadMessages(id);
  setTimeout(() => $("msg-input").focus(), 200);
  renderChats();
}

function closeActiveChat(showEmpty = true) {
  state.current = null;
  state.lastMsgCount = 0;
  $("main-screen").classList.remove("chat-open");
  $("active-chat").style.display = "none";
  $("pane-empty").style.display = showEmpty ? "grid" : "none";
}

function backToList() {
  closeActiveChat(true);
  renderChats();
}

async function loadMessages(otherId) {
  if (!state.me || !state.current || state.current.id !== otherId) return;
  try {
    const r = await fetch(`/api/messages/${state.me.id}/${otherId}`);
    const msgs = await r.json();
    renderMessages(msgs);
    if (Array.isArray(msgs) && msgs.length !== state.lastMsgCount) {
      state.lastMsgCount = msgs.length;
      loadChats();
    }
  } catch {}
}

function renderMessages(msgs) {
  const box = $("messages");
  const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  let html = "";
  let lastDay = "";
  const today = new Date().toDateString();
  const yest = new Date(Date.now() - 86400000).toDateString();

  msgs.forEach((m) => {
    const day = new Date(m.time).toDateString();
    if (day !== lastDay) {
      lastDay = day;
      const label = day === today ? "Сегодня"
                  : day === yest ? "Вчера"
                  : new Date(m.time).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
      html += `<div class="msg-time"><b>${label}</b></div>`;
    }

    const mine = m.from === state.me.id;
    let statusHtml = "";
    if (mine) {
      statusHtml = m.read
        ? `<div class="status read">${CHECK_TWO} Прочитано</div>`
        : `<div class="status">${CHECK_ONE} Доставлено</div>`;
    }

    html += `
      <div class="msg-row ${mine ? "me" : ""}">
        <div class="bubble-wrap">
          <div class="bubble">${escapeHtml(m.text)}</div>
          ${statusHtml}
        </div>
      </div>
    `;
  });

  box.innerHTML = html || `<div class="empty" style="padding:60px 20px; text-align:center">Нет сообщений. Напишите первым 👋</div>`;
  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = $("msg-input");
  const text = input.value.trim();
  if (!text || !state.current || !state.me) return;

  input.value = "";
  autoGrow(input);

  const box = $("messages");
  const emptyEl = box.querySelector(".empty");
  if (emptyEl) emptyEl.remove();

  box.insertAdjacentHTML("beforeend", `
    <div class="msg-row me">
      <div class="bubble-wrap">
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="status">${CHECK_ONE} Доставлено</div>
      </div>
    </div>
  `);
  box.scrollTop = box.scrollHeight;

  try {
    await fetch("/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from: state.me.id, to: state.current.id, text })
    });
    loadMessages(state.current.id);
  } catch {}
}

/* ============ NEW CHAT ============ */
function openNewChat() {
  $("new-chat-id").value = "";
  $("new-chat-backdrop").classList.add("active");
  setTimeout(() => $("new-chat-id").focus(), 100);
}
function closeNewChat() { $("new-chat-backdrop").classList.remove("active"); }

async function startChatByID() {
  const id = $("new-chat-id").value.trim();
  if (!/^\d{6}$/.test(id) || id === state.me.id) { shake($("new-chat-id")); return; }
  try {
    const r = await fetch("/api/user/" + id);
    if (!r.ok) throw new Error("not found");
    const u = await r.json();
    closeNewChat();
    openChat(u.id, u.name);
    loadChats();
  } catch {
    shake($("new-chat-id"));
  }
}

function shake(el) {
  el.style.borderColor = "rgba(255,69,58,.7)";
  el.animate([
    { transform: "translateX(0)" },
    { transform: "translateX(-5px)" },
    { transform: "translateX(5px)" },
    { transform: "translateX(0)" },
  ], { duration: 300 });
  setTimeout(() => el.style.borderColor = "", 1200);
}

/* ============ PROFILE ============ */
function openProfile() {
  if (!state.me) return;
  $("profile-avatar").textContent = initials(state.me.name);
  $("profile-name").textContent = state.me.name || "—";
  $("profile-id").textContent = "ID: " + state.me.id;
  $("profile-name-input").value = state.me.name || "";
  $("profile-backdrop").classList.add("active");
}
function closeProfile() { $("profile-backdrop").classList.remove("active"); }

async function saveName() {
  const name = $("profile-name-input").value.trim();
  if (!name) return;
  try {
    const r = await fetch("/api/user/name", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: state.me.id, password: state.me.password, name })
    });
    const d = await r.json();
    if (r.ok) {
      state.me.name = d.name;
      persist();
      $("me-avatar").textContent = initials(d.name);
      $("me-name").textContent = d.name;
      $("profile-name").textContent = d.name;
      $("profile-avatar").textContent = initials(d.name);
      $("profile-name-input").value = d.name;
      loadChats();
    }
  } catch {}
}

/* ============ CHAT INFO ============ */
function openChatInfo() {
  if (!state.current) return;
  $("info-avatar").textContent = initials(state.current.name);
  $("info-name").textContent = state.current.name;
  $("info-id").textContent = "ID: " + state.current.id;
  $("chat-info-backdrop").classList.add("active");
}
function closeChatInfo() { $("chat-info-backdrop").classList.remove("active"); }

/* ============ UTILS ============ */
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function escapeAttr(s) {
  return String(s == null ? "" : s).replace(/'/g, "&#39;").replace(/\\/g, "\\\\");
}

/* ============ BOOT ============ */
window.addEventListener("DOMContentLoaded", () => {
  if (restore()) {
    enterMessenger();
  } else {
    resetLoginForm();
  }
});
</script>
