<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Сообщения</title>
<style>
  :root {
    --bg: #000;
    --bg2: #1c1c1e;
    --bg3: #2c2c2e;
    --separator: rgba(84, 84, 88, 0.36);
    --text: #fff;
    --text2: #8e8e93;
    --text3: #636366;
    --blue: #0a84ff;
    --blue-ios: #007aff;
    --green: #30d158;
    --red: #ff453a;
    --bubble-me: #0a84ff;
    --bubble-other: #26262a;
    --nav-blur: rgba(22, 22, 24, 0.78);
    --radius-xl: 28px;
    --radius-lg: 16px;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  button, input, textarea {
    font: inherit;
    color: inherit;
  }
  button { cursor: pointer; border: 0; background: transparent; }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ============ AUTH ============ */
  #auth-screen {
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 20%, #0a0a0f, #000 60%);
  }

  .auth-card {
    width: min(100%, 400px);
    padding: 32px 26px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: var(--radius-xl);
    background: linear-gradient(180deg, rgba(44, 44, 46, 0.65), rgba(28, 28, 30, 0.85));
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(30px) saturate(150%);
    -webkit-backdrop-filter: blur(30px) saturate(150%);
    animation: card-in 0.5s var(--ease) both;
  }

  .auth-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }

  .auth-logo-icon {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: linear-gradient(180deg, #38d75a, #22b24c);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 30px rgba(48, 209, 88, 0.25);
  }

  .auth-logo-icon svg { width: 36px; height: 36px; color: #fff; }

  .auth-title {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
  }

  .auth-sub {
    margin: 0 0 22px;
    text-align: center;
    font-size: 14px;
    color: var(--text2);
    line-height: 1.4;
  }

  .field-group { display: grid; gap: 10px; margin-bottom: 8px; }

  .field-label {
    font-size: 12px;
    color: var(--text2);
    margin: 0 0 6px 2px;
    font-weight: 500;
  }

  .input-wrap { position: relative; }

  .input {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    background: rgba(118, 118, 128, 0.20);
    color: #fff;
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .input:focus {
    border-color: rgba(10, 132, 255, 0.9);
    background: rgba(118, 118, 128, 0.26);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.18);
  }
  .input::placeholder { color: rgba(235, 235, 245, 0.35); }

  .input.id-input {
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 20px;
    letter-spacing: 0.2em;
    font-weight: 700;
    color: var(--blue);
    padding: 0 16px;
  }

  .input.readonly {
    background: rgba(10, 132, 255, 0.08);
    border-color: rgba(10, 132, 255, 0.25);
  }

  .password-toggle {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--text2);
  }
  .password-toggle:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .password-toggle svg { width: 20px; height: 20px; }

  .btn {
    width: 100%;
    height: 50px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s var(--ease), background 0.15s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.975); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; }

  .btn-primary {
    background: var(--blue-ios);
    color: #fff;
    box-shadow: 0 8px 22px rgba(10, 132, 255, 0.22);
    margin-top: 14px;
  }

  .btn-link {
    margin: 16px auto 0;
    display: block;
    color: var(--blue-ios);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 10px;
    width: fit-content;
  }

  .alert {
    display: none;
    margin-bottom: 14px;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.4;
    border: 1px solid rgba(255, 69, 58, 0.25);
    background: rgba(255, 69, 58, 0.10);
    color: #ff6961;
  }
  .alert.show { display: block; animation: shake 0.35s; }
  .alert.success {
    border-color: rgba(48, 209, 88, 0.25);
    background: rgba(48, 209, 88, 0.10);
    color: #3ddb6b;
  }

  /* ============ NAV BAR (iOS) ============ */
  .nav {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    padding: 0 12px;
    background: var(--nav-blur);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 0.5px solid var(--separator);
    position: relative;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    height: calc(52px + env(safe-area-inset-top));
  }

  .nav-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .nav-btn {
    color: var(--blue-ios);
    font-size: 16px;
    padding: 6px 8px;
    min-width: 60px;
    text-align: left;
    font-weight: 400;
  }
  .nav-btn.right { text-align: right; }
  .nav-btn.bold { font-weight: 600; }

  /* ============ CHAT LIST ============ */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .search-wrap {
    padding: 10px 16px;
    border-bottom: 0.5px solid var(--separator);
    background: var(--bg);
  }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 10px;
    border-radius: 10px;
    background: var(--bg3);
    color: var(--text2);
  }
  .search svg { width: 16px; height: 16px; flex: 0 0 16px; }
  .search input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    color: #fff;
    font-size: 16px;
  }
  .search input::placeholder { color: var(--text3); }

  .chat-list { padding: 4px 0 20px; }

  .chat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 0.5px solid var(--separator);
    cursor: pointer;
    transition: background 0.1s;
  }
  .chat-row:active { background: var(--bg3); }

  .avatar {
    flex: 0 0 50px;
    width: 50px; height: 50px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 20px;
    font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, #5e5ce6, #0a84ff);
    user-select: none;
  }

  .chat-info { flex: 1; min-width: 0; }
  .chat-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-last {
    font-size: 14px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-time {
    font-size: 13px;
    color: var(--text2);
    flex: 0 0 auto;
    align-self: flex-start;
    padding-top: 2px;
    margin-left: 6px;
  }

  .empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--text2);
    font-size: 15px;
    line-height: 1.5;
  }

  /* ============ CONVERSATION ============ */
  #chat-screen .nav { justify-content: space-between; }
  #chat-screen .nav-title {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.1;
  }
  #chat-screen .nav-title small {
    font-size: 11px;
    color: var(--text2);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 400;
    margin-top: 2px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .msg-row {
    display: flex;
    justify-content: flex-start;
    padding: 0 4px;
    animation: msg-in 0.22s var(--ease);
  }
  .msg-row.me { justify-content: flex-end; }

  .bubble {
    max-width: 74%;
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 16px;
    line-height: 1.32;
    word-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
  }

  .msg-row:not(.me) .bubble {
    background: var(--bubble-other);
    color: #fff;
    border-bottom-left-radius: 6px;
  }
  .msg-row.me .bubble {
    background: var(--bubble-me);
    color: #fff;
    border-bottom-right-radius: 6px;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text3);
    text-align: center;
    margin: 10px 0 6px;
  }
  .msg-time b { color: var(--text2); font-weight: 600; }

  .composer {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top: 0.5px solid var(--separator);
    background: var(--nav-blur);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
  }

  .composer-input {
    flex: 1;
    min-height: 36px;
    max-height: 140px;
    padding: 8px 14px;
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    background: transparent;
    color: #fff;
    outline: none;
    font-size: 16px;
    line-height: 1.3;
    resize: none;
    font-family: inherit;
  }
  .composer-input::placeholder { color: var(--text3); }

  .send-btn {
    flex: 0 0 34px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--blue-ios);
    display: grid; place-items: center;
    color: #fff;
    transition: transform 0.15s, opacity 0.15s;
    align-self: flex-end;
    margin-bottom: 1px;
  }
  .send-btn:disabled { opacity: 0.4; transform: scale(0.9); }
  .send-btn svg { width: 18px; height: 18px; }

  /* ============ New chat popup ============ */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .sheet-backdrop.active { display: flex; }

  .sheet {
    width: min(100%, 340px);
    padding: 22px;
    border-radius: 22px;
    background: linear-gradient(180deg, #2c2c2e, #1c1c1e);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    animation: card-in 0.3s var(--ease);
  }
  .sheet h3 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 700;
    text-align: center;
  }
  .sheet p {
    margin: 0 0 16px;
    font-size: 13px;
    color: var(--text2);
    text-align: center;
    line-height: 1.4;
  }
  .sheet .input { text-align: center; font-family: ui-monospace, monospace; letter-spacing: 0.15em; font-size: 20px; font-weight: 700; color: var(--blue); }
  .sheet .btn-primary { margin-top: 14px; }

  .avatar-preview {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 4px 0 14px;
    color: var(--text2);
    font-size: 14px;
  }

  @keyframes card-in {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
    margin-right: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div class="screen active" id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.5 2 2 6 2 11c0 2.8 1.4 5.3 3.7 6.9-.2 1-.8 2.5-1.7 3.6-.2.2 0 .5.2.5 2 .1 3.9-.6 5.2-1.5.8.2 1.7.3 2.6.3 5.5 0 10-4 10-9S17.5 2 12 2z"/>
        </svg>
      </div>
    </div>

    <div id="auth-alert" class="alert"></div>

    <!-- LOGIN -->
    <section id="view-login">
      <h1 class="auth-title">Сообщения</h1>
      <p class="auth-sub">Войдите с вашим ID и паролем</p>

      <div class="field-group">
        <div>
          <div class="field-label">ID</div>
          <input id="login-id" class="input id-input" type="text" inputmode="numeric"
            maxlength="6" placeholder="000000" autocomplete="username">
        </div>
        <div>
          <div class="field-label">Пароль</div>
          <div class="input-wrap">
            <input id="login-password" class="input" type="password"
              placeholder="Пароль" autocomplete="current-password"
              onkeydown="handleEnter(event, doLogin)">
            <button class="password-toggle" type="button"
              onclick="togglePassword('login-password', this)"></button>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="login-btn" type="button" onclick="doLogin()">
        Войти
      </button>

      <button class="btn-link" type="button" onclick="showRegister()">
        Создать новый аккаунт
      </button>
    </section>

    <!-- REGISTER -->
    <section id="view-register" style="display:none">
      <h1 class="auth-title">Новый аккаунт</h1>
      <p class="auth-sub">Ваш ID сгенерирован автоматически</p>

      <div class="field-group">
        <div>
          <div class="field-label">Ваш ID</div>
          <input id="reg-id" class="input id-input readonly" type="text" readonly>
        </div>
        <div>
          <div class="field-label">Имя (необязательно)</div>
          <input id="reg-name" class="input" type="text" placeholder="Ваше имя" maxlength="40">
        </div>
        <div>
          <div class="field-label">Пароль</div>
          <div class="input-wrap">
            <input id="reg-password" class="input" type="password"
              placeholder="Минимум 6 символов" autocomplete="new-password"
              onkeydown="handleEnter(event, doRegister)">
            <button class="password-toggle" type="button"
              onclick="togglePassword('reg-password', this)"></button>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="register-btn" type="button" onclick="doRegister()">
        Создать и войти
      </button>

      <button class="btn-link" type="button" onclick="showLogin()">
        У меня уже есть аккаунт
      </button>
    </section>
  </div>
</div>

<!-- ================= CHAT LIST ================= -->
<div class="screen" id="list-screen">
  <div class="nav">
    <button class="nav-btn" type="button" onclick="openProfile()">Профиль</button>
    <div class="nav-title">Чаты</div>
    <button class="nav-btn right bold" type="button" onclick="openNewChat()">＋</button>
  </div>

  <div class="content">
    <div class="search-wrap">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search-input" type="text" placeholder="Поиск" oninput="renderChats()">
      </div>
    </div>

    <div class="chat-list" id="chat-list"></div>
  </div>
</div>

<!-- ================= CONVERSATION ================= -->
<div class="screen" id="chat-screen">
  <div class="nav">
    <button class="nav-btn" type="button" onclick="backToList()">
      <span style="color:var(--blue-ios)">‹ Чаты</span>
    </button>
    <div class="nav-title">
      <span id="chat-with-name">—</span>
      <small id="chat-with-id">ID: —</small>
    </div>
    <div style="min-width:60px"></div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <textarea id="msg-input" class="composer-input" rows="1"
      placeholder="iMessage" oninput="autoGrow(this)"
      onkeydown="handleComposerKey(event)"></textarea>
    <button class="send-btn" id="send-btn" type="button" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
      </svg>
    </button>
  </div>
</div>

<!-- ================= NEW CHAT SHEET ================= -->
<div class="sheet-backdrop" id="new-chat-backdrop" onclick="if(event.target===this)closeNewChat()">
  <div class="sheet">
    <h3>Новый чат</h3>
    <p>Введите ID пользователя (6 цифр)</p>
    <input id="new-chat-id" class="input" type="text" inputmode="numeric"
      maxlength="6" placeholder="000000"
      onkeydown="handleEnter(event, startChatByID)">
    <button class="btn btn-primary" type="button" onclick="startChatByID()">
      Найти
    </button>
    <button class="btn-link" type="button" onclick="closeNewChat()">Отмена</button>
  </div>
</div>

<!-- ================= PROFILE SHEET ================= -->
<div class="sheet-backdrop" id="profile-backdrop" onclick="if(event.target===this)closeProfile()">
  <div class="sheet">
    <h3>Профиль</h3>
    <div class="avatar-preview">
      <div class="avatar" id="profile-avatar">?</div>
      <div>
        <div style="color:#fff;font-weight:600" id="profile-name">—</div>
        <div style="font-family:ui-monospace,monospace" id="profile-id">ID: —</div>
      </div>
    </div>
    <input id="profile-name-input" class="input" type="text" placeholder="Ваше имя" maxlength="40" style="margin-bottom:10px">
    <button class="btn btn-primary" type="button" onclick="saveName()">Сохранить имя</button>
    <button class="btn-link" type="button" onclick="logout()" style="color:#ff6961">Выйти из аккаунта</button>
    <button class="btn-link" type="button" onclick="closeProfile()">Закрыть</button>
  </div>
</div>

<script>
/* ============ STATE ============ */
const state = {
  me: null,        // { id, name, password }
  chats: [],       // [{ with, name, last, time }]
  current: null,   // { id, name }
  pollTimer: null,
  refreshTimer: null,
};

const $ = (id) => document.getElementById(id);

/* ============ ICONS ============ */
const EYE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7s-3.5 7-10 7c-1.5 0-2.8-.4-4-.9"/><path d="M6.6 6.6C3.7 8.3 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.4 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;

document.querySelectorAll(".password-toggle").forEach(b => b.innerHTML = EYE);

/* ============ UI HELPERS ============ */
function alertBox(msg, success = false) {
  const el = $("auth-alert");
  el.textContent = msg;
  el.classList.toggle("success", success);
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}
function hideAlert() { $("auth-alert").classList.remove("show"); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function togglePassword(id, btn) {
  const input = $(id);
  const visible = input.type === "text";
  input.type = visible ? "password" : "text";
  btn.innerHTML = visible ? EYE : EYE_OFF;
}

function handleEnter(e, fn) {
  if (e.key === "Enter") { e.preventDefault(); fn(); }
}

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 140) + "px";
  $("send-btn").disabled = !el.value.trim();
}

function handleComposerKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const same = d.toDateString() === now.toDateString();
  if (same) return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  const diff = (now - d) / 86400000;
  if (diff < 7) return d.toLocaleDateString("ru-RU", { weekday: "short" });
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
}

function fmtBubbleTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function initials(name) {
  if (!name) return "?";
  const t = name.trim();
  return t.charAt(0).toUpperCase() || "?";
}

/* ============ AUTH ============ */
function showLogin() {
  hideAlert();
  $("view-register").style.display = "none";
  $("view-login").style.display = "";
  setTimeout(() => $("login-id").focus(), 100);
}

async function showRegister() {
  hideAlert();
  $("view-login").style.display = "none";
  $("view-register").style.display = "";
  $("reg-id").value = "……";
  try {
    const r = await fetch("/api/generate-id");
    const d = await r.json();
    $("reg-id").value = d.id;
  } catch {
    alertBox("Не удалось создать ID. Попробуйте позже.");
  }
  setTimeout(() => $("reg-name").focus(), 100);
}

async function doLogin() {
  hideAlert();
  const id = $("login-id").value.trim();
  const password = $("login-password").value;

  if (!/^\d{6}$/.test(id)) return alertBox("ID должен состоять из 6 цифр.");
  if (!password) return alertBox("Введите пароль.");

  const btn = $("login-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Вход…`;

  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, password })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Ошибка входа");

    state.me = { id: d.id, name: d.name, password };
    persist();
    enterMessenger();
  } catch (e) {
    alertBox(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Войти";
  }
}

async function doRegister() {
  hideAlert();
  const id = $("reg-id").value.trim();
  const name = $("reg-name").value.trim();
  const password = $("reg-password").value;

  if (!/^\d{6}$/.test(id)) return alertBox("ID ещё не готов. Подождите или обновите.");
  if (password.length < 6) return alertBox("Пароль минимум 6 символов.");

  const btn = $("register-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Создание…`;

  try {
    const r = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, password })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Ошибка регистрации");

    // сохраняем имя, если ввели
    if (name) {
      await fetch("/api/user/name", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, password, name })
      });
    }

    state.me = { id, name: name || ("Пользователь " + id), password };
    persist();
    enterMessenger();
  } catch (e) {
    alertBox(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Создать и войти";
  }
}

function logout() {
  stopTimers();
  try { localStorage.removeItem("message.me"); } catch {}
  state.me = null;
  state.current = null;
  state.chats = [];
  closeProfile();
  showScreen("auth-screen");
  showLogin();
  $("login-password").value = "";
}

/* ============ PERSIST ============ */
function persist() {
  try { localStorage.setItem("message.me", JSON.stringify(state.me)); } catch {}
}
function restore() {
  try {
    const raw = localStorage.getItem("message.me");
    if (!raw) return false;
    const me = JSON.parse(raw);
    if (me && me.id && me.password) {
      state.me = me;
      return true;
    }
  } catch {}
  return false;
}

/* ============ MESSENGER ============ */
function enterMessenger() {
  showScreen("list-screen");
  loadChats();
  startTimers();
}

function startTimers() {
  stopTimers();
  state.refreshTimer = setInterval(loadChats, 4000);
  state.pollTimer = setInterval(() => {
    if (state.current) loadMessages(state.current.id);
  }, 2000);
}
function stopTimers() {
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.refreshTimer = null;
  state.pollTimer = null;
}

/* ============ CHAT LIST ============ */
async function loadChats() {
  if (!state.me) return;
  try {
    const r = await fetch("/api/chats/" + state.me.id);
    const list = await r.json();
    state.chats = Array.isArray(list) ? list : [];
    renderChats();
  } catch {}
}

function renderChats() {
  const list = $("chat-list");
  const q = ($("search-input").value || "").trim().toLowerCase();

  const items = state.chats.filter(c => {
    if (!q) return true;
    return (c.name || "").toLowerCase().includes(q) || c.with.includes(q);
  });

  if (!items.length) {
    list.innerHTML = `<div class="empty">
      ${q ? "Ничего не найдено" : "Нет чатов.<br>Нажмите ＋ вверху, чтобы начать диалог по ID."}
    </div>`;
    return;
  }

  list.innerHTML = items.map(c => `
    <div class="chat-row" onclick="openChat('${c.with}', '${escapeAttr(c.name)}')">
      <div class="avatar">${escapeHtml(initials(c.name))}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(c.name)}</div>
        <div class="chat-last">${escapeHtml(c.last || "Нет сообщений")}</div>
      </div>
      <div class="chat-time">${fmtTime(c.time)}</div>
    </div>
  `).join("");
}

/* ============ CONVERSATION ============ */
function openChat(id, name) {
  state.current = { id, name };
  $("chat-with-name").textContent = name;
  $("chat-with-id").textContent = "ID: " + id;
  showScreen("chat-screen");
  $("messages").innerHTML = "";
  loadMessages(id);
  setTimeout(() => $("msg-input").focus(), 150);
}

function backToList() {
  state.current = null;
  showScreen("list-screen");
  loadChats();
}

async function loadMessages(otherId) {
  if (!state.me || !state.current) return;
  try {
    const r = await fetch(`/api/messages/${state.me.id}/${otherId}`);
    const msgs = await r.json();
    renderMessages(msgs);
  } catch {}
}

function renderMessages(msgs) {
  const box = $("messages");
  const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;

  let html = "";
  let lastDay = "";
  msgs.forEach((m, i) => {
    const day = new Date(m.time).toDateString();
    if (day !== lastDay) {
      lastDay = day;
      const today = new Date().toDateString();
      const yest = new Date(Date.now() - 86400000).toDateString();
      const label = day === today ? "Сегодня"
                  : day === yest ? "Вчера"
                  : new Date(m.time).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
      html += `<div class="msg-time"><b>${label}</b></div>`;
    }
    const mine = m.from === state.me.id;
    html += `
      <div class="msg-row ${mine ? "me" : ""}">
        <div class="bubble">${escapeHtml(m.text)}</div>
      </div>
    `;
  });
  box.innerHTML = html || `<div class="empty" style="padding:60px 20px">Нет сообщений</div>`;

  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = $("msg-input");
  const text = input.value.trim();
  if (!text || !state.current || !state.me) return;

  input.value = "";
  autoGrow(input);

  // оптимистично
  const box = $("messages");
  const emptyEl = box.querySelector(".empty");
  if (emptyEl) emptyEl.remove();
  box.insertAdjacentHTML("beforeend", `
    <div class="msg-row me">
      <div class="bubble">${escapeHtml(text)}</div>
    </div>
  `);
  box.scrollTop = box.scrollHeight;

  try {
    await fetch("/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from: state.me.id, to: state.current.id, text })
    });
    loadMessages(state.current.id);
  } catch {}
}

/* ============ NEW CHAT ============ */
function openNewChat() {
  $("new-chat-id").value = "";
  $("new-chat-backdrop").classList.add("active");
  setTimeout(() => $("new-chat-id").focus(), 100);
}
function closeNewChat() {
  $("new-chat-backdrop").classList.remove("active");
}

async function startChatByID() {
  const id = $("new-chat-id").value.trim();
  if (!/^\d{6}$/.test(id)) {
    $("new-chat-id").style.borderColor = "rgba(255,69,58,.7)";
    setTimeout(() => $("new-chat-id").style.borderColor = "", 1200);
    return;
  }
  if (id === state.me.id) {
    $("new-chat-id").style.borderColor = "rgba(255,69,58,.7)";
    setTimeout(() => $("new-chat-id").style.borderColor = "", 1200);
    return;
  }
  try {
    const r = await fetch("/api/user/" + id);
    if (!r.ok) throw new Error("not found");
    const u = await r.json();
    closeNewChat();
    openChat(u.id, u.name);
    loadChats();
  } catch {
    $("new-chat-id").style.borderColor = "rgba(255,69,58,.7)";
    setTimeout(() => $("new-chat-id").style.borderColor = "", 1200);
  }
}

/* ============ PROFILE ============ */
function openProfile() {
  if (!state.me) return;
  $("profile-avatar").textContent = initials(state.me.name);
  $("profile-name").textContent = state.me.name || "—";
  $("profile-id").textContent = "ID: " + state.me.id;
  $("profile-name-input").value = state.me.name || "";
  $("profile-backdrop").classList.add("active");
}
function closeProfile() {
  $("profile-backdrop").classList.remove("active");
}
async function saveName() {
  const name = $("profile-name-input").value.trim();
  if (!name) return;
  try {
    const r = await fetch("/api/user/name", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: state.me.id, password: state.me.password, name })
    });
    const d = await r.json();
    if (r.ok) {
      state.me.name = d.name;
      persist();
      $("profile-name").textContent = d.name;
      $("profile-avatar").textContent = initials(d.name);
      $("profile-name-input").value = d.name;
    }
  } catch {}
}

/* ============ UTILS ============ */
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function escapeAttr(s) {
  return String(s == null ? "" : s).replace(/'/g, "&#39;").replace(/\\/g, "\\\\");
}

/* ============ BOOT ============ */
window.addEventListener("DOMContentLoaded", () => {
  if (restore()) {
    enterMessenger();
  } else {
    showLogin();
  }
});
</script>
