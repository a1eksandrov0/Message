<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: #161617;
      color: #f5f5f7;
    }
    .apple-card {
      background: rgba(30, 30, 32, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Стилизация скроллбара */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-4 overflow-hidden relative select-none">

  <!-- Главный приветственный экран -->
  <div id="landing-screen" class="flex flex-col items-center justify-between h-[80vh] max-w-2xl text-center px-4">
    <div class="mt-12">
      <h1 class="text-7xl md:text-8xl font-bold tracking-tight text-white">Message</h1>
    </div>

    <button onclick="showAuthModal()" class="bg-white hover:bg-gray-200 text-black font-medium text-lg px-8 py-3 rounded-full transition duration-200 shadow-lg cursor-pointer">
      Войти
    </button>

    <div class="mb-12">
      <p class="text-2xl md:text-4xl font-semibold leading-relaxed text-gray-200">
        Сервис экспресс-сообщений.
      </p>
    </div>
  </div>

  <!-- Окно авторизации -->
  <div id="auth-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="apple-card rounded-3xl p-8 w-full max-w-md shadow-2xl relative flex flex-col items-center text-center">
      
      <button onclick="hideAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl p-2">✕</button>

      <h2 class="text-2xl font-semibold mb-6 mt-2">Вход с Аккаунтом Message</h2>

      <div id="auth-error" class="text-red-400 text-sm mb-4 hidden w-full text-center px-2 py-1 bg-red-500/10 rounded-lg border border-red-500/20"></div>

      <div class="space-y-4 w-full">
        <!-- Поле ввода ID -->
        <div class="relative w-full">
          <input id="auth-id" type="text" maxlength="6" placeholder="6-значный ID" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 pr-32 font-mono">
          <button type="button" onclick="generateRandomId()" class="absolute right-2 top-2 bottom-2 px-3 bg-white/10 hover:bg-white/20 text-xs text-blue-400 rounded-lg transition border border-white/10">
            Сгенерировать
          </button>
        </div>

        <!-- Поле ввода пароля -->
        <input id="auth-password" type="password" placeholder="Пароль (только латиница)" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500">

        <div class="pt-2 flex gap-3">
          <button onclick="login()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition">Продолжить</button>
          <button onclick="register()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-medium py-3 rounded-xl transition">Создать ID</button>
        </div>
      </div>

      <p class="text-xs text-gray-500 mt-6 leading-relaxed">
        Сведения об аккаунте Message используются для обеспечения безопасного входа и передачи сообщений.
      </p>
    </div>
  </div>

  <!-- Экран Мессенджера -->
  <div id="chat-screen" class="apple-card rounded-3xl w-full max-w-5xl h-[85vh] shadow-2xl flex hidden overflow-hidden border border-white/10">
    <!-- Боковая панель -->
    <div class="w-1/3 border-r border-white/10 p-4 flex flex-col justify-between bg-black/20">
      <div class="flex flex-col h-full overflow-hidden">
        <div class="flex justify-between items-center mb-4 flex-shrink-0">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Мой ID</span>
          <span id="my-id-display" class="font-mono bg-blue-500/20 text-blue-400 px-3 py-1 rounded-lg text-sm font-bold border border-blue-500/30">------</span>
        </div>
        
        <h2 class="text-2xl font-bold text-white mb-4 flex-shrink-0">Message</h2>
        
        <!-- Поле и кнопка создания нового диалога -->
        <div class="space-y-3 mb-4 flex-shrink-0">
          <input id="target-id" type="text" maxlength="6" placeholder="ID собеседника..." class="w-full px-4 py-2.5 rounded-xl border border-white/10 bg-white/5 text-sm focus:outline-none focus:border-blue-500 font-mono text-white">
          <button onclick="handleManualStartChat()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm py-2.5 rounded-xl transition font-medium">Открыть чат</button>
        </div>

        <!-- Список диалогов -->
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 flex-shrink-0">Диалоги</div>
        <div id="recent-chats-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <!-- Сюда динамически добавляются карточки чатов -->
        </div>
      </div>

      <button onclick="location.reload()" class="text-red-400 hover:text-red-300 text-sm font-medium text-left transition pt-3 flex-shrink-0 border-t border-white/10">Выйти</button>
    </div>

    <!-- Область диалога -->
    <div class="w-2/3 flex flex-col justify-between bg-black/40">
      <div class="p-4 border-b border-white/10 bg-white/5 flex items-center">
        <span class="text-sm font-medium text-gray-400">Собеседник: </span>
        <span id="active-chat-id" class="ml-2 font-mono font-bold text-white">Не выбран</span>
      </div>

      <div id="messages-container" class="p-4 overflow-y-auto flex-1 space-y-3">
        <div class="text-center text-gray-500 text-sm mt-10">Выберите диалог слева или введите ID собеседника</div>
      </div>

      <div class="p-4 border-t border-white/10 bg-white/5 flex gap-2">
        <input id="message-input" type="text" placeholder="Ваше сообщение..." class="flex-1 px-4 py-2.5 rounded-full border border-white/10 bg-white/10 focus:outline-none focus:border-blue-500 text-sm text-white" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-full text-sm font-medium transition">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myId = null;
    let currentChatId = null;
    
    // Хранение истории активных чатов { chatId: { unreadCount: Number, lastText: String } }
    const activeChats = {};

    function showAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
      clearError();
    }

    function hideAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function generateRandomId() {
      const randomId = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('auth-id').value = randomId;
    }

    function validateEnglishPassword(password) {
      return /^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+$/.test(password);
    }

    async function register() {
      clearError();
      const customId = document.getElementById('auth-id').value.trim();
      const password = document.getElementById('auth-password').value;
      
      if (!password) return showError('Введите пароль');
      if (!validateEnglishPassword(password)) {
        return showError('Пароль должен содержать только английские буквы и символы');
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customId: customId || null, password })
        });
        const data = await res.json();

        if (data.error) return showError(data.error);

        myId = data.id;
        openChatScreen();
      } catch (e) {
        showError('Ошибка соединения с сервером');
      }
    }

    async function login() {
      clearError();
      const id = document.getElementById('auth-id').value.trim();
      const password = document.getElementById('auth-password').value;

      if (!id) return showError('Введите ваш ID');
      if (!password) return showError('Введите пароль');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, password })
        });
        const data = await res.json();

        if (data.error) return showError(data.error);

        myId = data.id;
        openChatScreen();
      } catch (e) {
        showError('Ошибка соединения с сервером');
      }
    }

    function openChatScreen() {
      document.getElementById('landing-screen').classList.add('hidden');
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('my-id-display').innerText = myId;
      socket.emit('register_socket', myId);
    }

    function handleManualStartChat() {
      const targetId = document.getElementById('target-id').value.trim();
      if (!targetId || targetId === myId) return alert('Введите корректный ID собеседника');
      
      openChatWith(targetId);
      document.getElementById('target-id').value = '';
    }

    async function openChatWith(targetId) {
      currentChatId = targetId;
      document.getElementById('active-chat-id').innerText = currentChatId;

      // Сбрасываем непрочитанные для открываемого чата
      if (!activeChats[targetId]) {
        activeChats[targetId] = { unreadCount: 0, lastText: '' };
      } else {
        activeChats[targetId].unreadCount = 0;
      }

      renderRecentChatsList();

      const res = await fetch(`/api/messages/${myId}/${currentChatId}`);
      const messages = await res.json();

      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      if (Array.isArray(messages)) {
        messages.forEach(addMessageToUI);
      }
    }

    function renderRecentChatsList() {
      const listContainer = document.getElementById('recent-chats-list');
      listContainer.innerHTML = '';

      Object.keys(activeChats).forEach(chatId => {
        const chatData = activeChats[chatId];
        const isActive = chatId === currentChatId;

        const chatItem = document.createElement('div');
        chatItem.onclick = () => openChatWith(chatId);
        chatItem.className = `p-3 rounded-xl border transition cursor-pointer flex justify-between items-center ${
          isActive 
            ? 'bg-blue-600/20 border-blue-500/50 text-white' 
            : 'bg-white/5 hover:bg-white/10 border-white/10 text-gray-300'
        }`;

        chatItem.innerHTML = `
          <div class="overflow-hidden mr-2">
            <div class="font-mono font-bold text-sm text-white flex items-center gap-2">
              ${chatId}
            </div>
            <div class="text-xs text-gray-400 truncate mt-0.5">
              ${chatData.unreadCount > 0 ? '<span class="text-blue-400 font-semibold">Новое сообщение</span>' : (chatData.lastText || 'Переписка')}
            </div>
          </div>
          ${
            chatData.unreadCount > 0 
              ? `<span class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0">${chatData.unreadCount}</span>` 
              : ''
          }
        `;

        listContainer.appendChild(chatItem);
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return alert('Выберите собеседника и введите текст');

      socket.emit('send_message', {
        sender_id: myId,
        receiver_id: currentChatId,
        text: text
      });

      input.value = '';
    }

    // Подтверждение успешной отправки
    socket.on('message_sent', (msg) => {
      const targetId = msg.receiver_id;
      if (!activeChats[targetId]) {
        activeChats[targetId] = { unreadCount: 0, lastText: msg.text };
      } else {
        activeChats[targetId].lastText = msg.text;
      }

      if (targetId === currentChatId) {
        addMessageToUI(msg);
      }
      
      renderRecentChatsList();
    });

    // Прием входящего сообщения
    socket.on('receive_message', (msg) => {
      const senderId = msg.sender_id;

      if (!activeChats[senderId]) {
        activeChats[senderId] = { unreadCount: 0, lastText: msg.text };
      }

      activeChats[senderId].lastText = msg.text;

      // Если чат с отправителем открыт прямо сейчас
      if (currentChatId === senderId) {
        addMessageToUI(msg);
      } else {
        // Увеличиваем счётчик непрочитанных
        activeChats[senderId].unreadCount += 1;
      }

      renderRecentChatsList();
    });

    function addMessageToUI(msg) {
      const container = document.getElementById('messages-container');
      const isMe = msg.sender_id === myId;

      const div = document.createElement('div');
      div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
      div.innerHTML = `
        <div class="max-w-xs px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white/10 text-white rounded-bl-none'} shadow">
          ${msg.text}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function showError(msg) {
      const err = document.getElementById('auth-error');
      err.innerText = msg;
      err.classList.remove('hidden');
    }

    function clearError() {
      const err = document.getElementById('auth-error');
      err.innerText = '';
      err.classList.add('hidden');
    }
  </script>
</body>
</html>
