<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMessage Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    }
    .glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

  <div id="auth-screen" class="glass rounded-3xl p-8 w-full max-w-md shadow-2xl text-center">
    <h1 class="text-3xl font-semibold text-gray-800 mb-2">Сообщения</h1>
    <p class="text-gray-500 mb-6 text-sm">Простой и безопасный мессенджер</p>

    <div id="auth-error" class="text-red-500 text-sm mb-4 hidden"></div>

    <div class="space-y-4">
      <input id="auth-id" type="text" placeholder="6-значный ID (для входа)" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/50">
      <input id="auth-password" type="password" placeholder="Пароль" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/50">
      
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">Войти</button>
      <div class="relative my-4">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
        <div class="relative text-xs text-gray-400 bg-transparent px-2">ИЛИ</div>
      </div>
      <button onclick="register()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-3 rounded-xl transition">Зарегистрироваться</button>
    </div>
  </div>

  <div id="chat-screen" class="glass rounded-3xl w-full max-w-4xl h-[80vh] shadow-2xl flex hidden overflow-hidden">
    <div class="w-1/3 border-r border-gray-200/50 p-4 flex flex-col justify-between bg-white/30">
      <div>
        <div class="flex justify-between items-center mb-4">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Мой ID</span>
          <span id="my-id-display" class="font-mono bg-blue-100 text-blue-700 px-2 py-1 rounded-lg text-sm font-bold">------</span>
        </div>
        <h2 class="text-xl font-bold text-gray-800 mb-4">Чаты</h2>
        <div class="space-y-2">
          <input id="target-id" type="text" placeholder="Введите ID собеседника..." class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm bg-white/50 focus:outline-none">
          <button onclick="startChat()" class="w-full bg-blue-500 text-white text-sm py-2 rounded-xl">Открыть чат</button>
        </div>
      </div>
      <button onclick="location.reload()" class="text-red-500 text-sm font-medium text-left">Выйти</button>
    </div>

    <div class="w-2/3 flex flex-col justify-between bg-white/40">
      <div class="p-4 border-b border-gray-200/50 bg-white/20 flex items-center">
        <span class="text-sm font-medium text-gray-600">Собеседник: </span>
        <span id="active-chat-id" class="ml-2 font-mono font-bold text-gray-800">Не выбран</span>
      </div>

      <div id="messages-container" class="p-4 overflow-y-auto flex-1 space-y-3">
        <div class="text-center text-gray-400 text-sm mt-10">Введите ID собеседника слева и нажмите «Открыть чат»</div>
      </div>

      <div class="p-4 border-t border-gray-200/50 bg-white/20 flex gap-2">
        <input id="message-input" type="text" placeholder="Ваше сообщение..." class="flex-1 px-4 py-2 rounded-full border border-gray-300 bg-white/60 focus:outline-none text-sm">
        <button onclick="sendMessage()" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-medium">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myId = null;
    let currentChatId = null;

    async function register() {
      const password = document.getElementById('auth-password').value;
      if (!password) return showError('Придумайте пароль');

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();

      if (data.error) return showError(data.error);

      alert(`Ваш личный 6-значный ID: ${data.id}\nЗапомните его для входа!`);
      myId = data.id;
      openChatScreen();
    }

    async function login() {
      const id = document.getElementById('auth-id').value;
      const password = document.getElementById('auth-password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, password })
      });
      const data = await res.json();

      if (data.error) return showError(data.error);

      myId = data.id;
      openChatScreen();
    }

    function openChatScreen() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('my-id-display').innerText = myId;
      socket.emit('register_socket', myId);
    }

    async function startChat() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId || targetId === myId) return alert('Введите корректный ID собеседника');
      
      currentChatId = targetId;
      document.getElementById('active-chat-id').innerText = currentChatId;

      const res = await fetch(`/api/messages/${myId}/${currentChatId}`);
      const messages = await res.json();

      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      messages.forEach(addMessageToUI);
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      socket.emit('send_message', {
        sender_id: myId,
        receiver_id: currentChatId,
        text: text
      });

      input.value = '';
    }

    socket.on('message_sent', (msg) => {
      if (msg.receiver_id === currentChatId || msg.sender_id === currentChatId) {
        addMessageToUI(msg);
      }
    });

    socket.on('receive_message', (msg) => {
      if (msg.sender_id === currentChatId) {
        addMessageToUI(msg);
      } else {
        alert(`Новое сообщение от ID: ${msg.sender_id}`);
      }
    });

    function addMessageToUI(msg) {
      const container = document.getElementById('messages-container');
      const isMe = msg.sender_id === myId;

      const div = document.createElement('div');
      div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
      div.innerHTML = `
        <div class="max-w-xs px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'} shadow">
          ${msg.text}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function showError(msg) {
      const err = document.getElementById('auth-error');
      err.innerText = msg;
      err.classList.remove('hidden');
    }
  </script>
</body>
</html>
